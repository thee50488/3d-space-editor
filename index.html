<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mesh Studio</title>
<style>
:root{--bg:#232323;--pn:#303030;--pn2:#3a3a3a;--bd:#4a4a4a;--tx:#dcdcdc;--ac:#e87d0d;--bl:#4772b3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#232323}}
:root[data-theme="dark"]{--bg:#232323}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#cfcfcf;--pn:#e4e4e4;--pn2:#d6d6d6;--bd:#999;--tx:#1d1d1d}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:13px/1.3 "Segoe UI",Roboto,"Noto Sans",sans-serif;overflow:hidden;user-select:none}
#app{display:flex;flex-direction:column;height:100%}
#menubar{display:flex;background:var(--pn);border-bottom:1px solid var(--bd);overflow-x:auto;flex:none;scrollbar-width:none}
button{background:var(--pn2);color:var(--tx);border:1px solid var(--bd);border-radius:4px;font:inherit;min-height:34px;padding:0 10px}
button.on{background:var(--bl);border-color:var(--bl);color:#fff}
#menubar button{border:0;border-radius:0;background:none;min-height:38px;padding:0 13px}
#dd{position:fixed;display:none;z-index:50;background:var(--pn);border:1px solid var(--bd);border-radius:4px;min-width:180px;max-height:70%;overflow:auto;box-shadow:0 6px 18px #0008}
#dd div{padding:11px 14px}#dd div:active{background:var(--bl);color:#fff}#dd .dim{opacity:.45}
#main{flex:1;display:flex;position:relative;min-height:0}
#rail{width:52px;background:var(--pn);border-right:1px solid var(--bd);display:flex;flex-direction:column;gap:4px;padding:4px;overflow-y:auto;flex:none}
#rail button{padding:0;font-size:11px;min-height:44px}
#vp{flex:1;position:relative;min-width:0;background:#3b3b3b}
canvas{display:block;width:100%;height:100%;touch-action:none}
#hint{position:absolute;left:8px;top:6px;font-size:11px;opacity:.7;pointer-events:none}
#side{position:absolute;right:0;top:0;bottom:0;width:236px;max-width:78%;background:var(--pn);border-left:1px solid var(--bd);overflow-y:auto;padding:4px 8px;z-index:5}
#side summary{padding:9px 0;font-weight:600}
#side label{display:flex;align-items:center;gap:6px;margin:4px 0}#side label span{width:62px;flex:none}
#side input[type=range]{flex:1;min-width:0}
#side input[type=text],#side input[type=number]{width:100%;min-width:0;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:3px;padding:6px}
.xyz{display:flex;gap:4px;margin:4px 0}
.sw{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}.sw i{width:28px;height:28px;border-radius:4px;border:1px solid var(--bd)}
.row{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}
#menubar::-webkit-scrollbar,#bar::-webkit-scrollbar{display:none}#side,#side input,#side button{touch-action:manipulation}#side input[type=range]{touch-action:none}#pad{position:absolute;bottom:10px;display:flex;flex-direction:column;gap:6px;z-index:6}#pad button{min-width:64px;min-height:42px;opacity:.9}
#joy{position:absolute;bottom:12px;width:132px;height:132px;border-radius:50%;background:#0007;border:2px solid var(--bd);z-index:6;touch-action:none;display:none}
#knob{position:absolute;width:56px;height:56px;border-radius:50%;background:var(--ac);left:38px;top:38px;opacity:.9;pointer-events:none}
#joyud{position:absolute;bottom:152px;display:none;flex-direction:column;gap:6px;z-index:6}#joyud button{min-width:64px;min-height:42px;touch-action:none}
#modal label{display:flex;align-items:center;gap:8px;margin:8px 0}#modal select,#modal input[type=range]{min-width:120px}
#ev,#rd,#an{display:none;position:absolute;left:58px;top:8px;width:230px;max-height:82%;overflow-y:auto;background:var(--pn);border:1px solid var(--bd);border-radius:6px;padding:6px 8px;z-index:7}.fw label{display:flex;align-items:center;gap:6px;margin:4px 0}.fw label span{width:76px;flex:none}.fw input[type=range]{flex:1;min-width:0;touch-action:none}.fw select,.fw input[type=number]{min-height:34px;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:4px;min-width:0;flex:1}.fw b{display:block;margin-top:6px}
#stats{position:absolute;right:8px;bottom:6px;font-size:11px;opacity:.75;pointer-events:none;display:none}#pipb{position:absolute;right:8px;top:8px;width:200px;height:112px;border:2px solid var(--ac);pointer-events:none;display:none;z-index:3}#selbox{position:absolute;border:1px dashed var(--ac);background:#e87d0d33;display:none;pointer-events:none;z-index:3}
#side .ol{padding:6px;border-bottom:1px solid var(--bd);font-size:12px}#side .ol.on{background:var(--bl);color:#fff}#side .ol.ms{outline:1px solid var(--ac)}
#wtabs{display:flex;gap:3px;background:var(--bg);padding:4px 6px 0;overflow-x:auto;flex:none;border-bottom:1px solid var(--bd);scrollbar-width:none}#wtabs::-webkit-scrollbar{display:none}#wtabs button{border-radius:7px 7px 0 0;border-bottom:0;min-height:32px;padding:0 14px;white-space:nowrap;background:var(--pn2)}#wtabs button.on{background:var(--bl);color:#fff}
#tl{display:none;flex-direction:column;height:236px;background:var(--pn);border-top:1px solid var(--bd);flex:none}#tlh{display:flex;flex-wrap:wrap;gap:4px;padding:4px;align-items:center}#tlh button{min-height:30px;padding:0 8px}#tlh label{display:flex;align-items:center;gap:4px}#tlh input,#tlh select{min-height:30px;width:60px;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:4px}#tlwrap{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;min-height:0}#tlr{position:sticky;top:0;display:block;z-index:2;touch-action:none}#tlk{display:block;touch-action:pan-y}
#home,#modepick{display:none;position:fixed;inset:0;z-index:100;background:var(--bg);flex-direction:column;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}#modepick{z-index:101;align-items:center;justify-content:center;padding:16px}
.pc{background:var(--pn);border:1px solid var(--bd);border-radius:8px;overflow:hidden;display:flex;flex-direction:column}.pc img,.pc .ph{width:100%;height:100px;object-fit:cover;background:#3b3b3b;display:block}.pc div{padding:8px;display:flex;flex-direction:column;gap:6px}.pc .r{flex-direction:row;flex-wrap:wrap;gap:4px;padding:0 8px 8px}.pc .r button{min-height:30px;padding:0 8px;flex:1}
.mc{background:var(--pn);border:2px solid var(--bd);border-radius:10px;padding:18px;text-align:left;min-height:110px;width:100%;margin:6px 0;font-size:14px}.mc b{font-size:17px}
#tw{display:none;position:absolute;left:58px;top:8px;width:216px;max-height:80%;overflow-y:auto;background:var(--pn);border:1px solid var(--bd);border-radius:6px;padding:6px 8px;z-index:7}#tw select{width:100%;min-height:34px;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:4px}#lib{display:none;position:absolute;left:52px;right:0;bottom:0;height:46%;background:var(--pn);border-top:1px solid var(--bd);z-index:6;flex-direction:column}
#lib .tabs{display:flex;gap:4px;padding:6px;overflow-x:auto;flex:none}
#lib input{margin:0 6px 6px;padding:8px;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:4px}
#items{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:6px;padding:0 6px 6px;align-content:start}
.it{background:var(--pn2);border:1px solid var(--bd);border-radius:4px;padding:8px;display:flex;flex-direction:column;gap:6px}
.it b{font-weight:600}.it small{opacity:.6}.it div{display:flex;gap:4px}.it button{min-height:30px;flex:1;padding:0 4px}
#bar{display:flex;align-items:center;gap:6px;background:var(--pn);border-top:1px solid var(--bd);padding:3px 6px;flex:none;overflow-x:auto;white-space:nowrap}
#bar span{opacity:.75}
#toast{position:fixed;left:50%;bottom:64px;transform:translateX(-50%);background:#000c;color:#fff;padding:9px 14px;border-radius:6px;display:none;z-index:99;max-width:86%}
#modal{display:none;position:fixed;inset:0;background:#000a;z-index:90;align-items:center;justify-content:center}
#modal div{background:var(--pn);border:1px solid var(--bd);border-radius:6px;padding:16px;max-width:88%;max-height:80%;overflow:auto;user-select:text}
</style></head><body>
<div id="app">
<div id="wtabs"></div>
<div id="menubar"></div>
<div id="main">
<div id="rail"></div>
<div id="vp"><canvas id="cv"></canvas><div id="hint"></div><div id="stats"></div><div id="pipb"></div><div id="selbox"></div><div id="pad"></div><div id="joyud"><button id="jup">Up</button><button id="jdn">Down</button></div><div id="joy"><div id="knob"></div></div></div>
<div id="side"></div>
<div id="tw"><div style="display:flex;justify-content:space-between;align-items:center"><b>Physics test</b><button onclick="tgl('#tw')">Close</button></div><div class="row"><button onclick="physToggle()">Play / Pause</button><button onclick="physStop()">Reset</button><button onclick="clearTests()">Clear</button></div><small id="tstat">Press Play</small><div class="row" id="tsc"></div><div class="row"><select id="tsel"></select></div><div class="row"><button onclick="spawn('sphere',0)">Ball</button><button onclick="spawn('box',0)">Crate</button><button onclick="spawn('sphere',1)">Throw</button></div></div>
<div id="ev" class="fw"></div><div id="rd" class="fw"></div><div id="an" class="fw"></div>
<div id="lib"><div class="tabs" id="tabs"></div><input id="q" placeholder="Search name or tag" oninput="drawLib()"><div id="items"></div></div>
</div>
<div id="tl"><div id="tlh"></div><div id="tlwrap"><canvas id="tlr"></canvas><canvas id="tlk"></canvas></div></div>
<div id="bar"></div>
</div>
<div id="dd"></div><div id="toast"></div><div id="modal" onclick="this.style.display='none'"><div id="mbody" onclick="event.stopPropagation()"></div></div>
<input type="file" id="fimg" accept="image/*" style="display:none">
<input type="file" id="fproj" accept=".json,application/json" style="display:none">
<div id="home"></div><div id="modepick"></div>
<input type="file" id="fi" style="display:none">
